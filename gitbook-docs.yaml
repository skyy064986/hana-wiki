$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: project Hana Docs
  structure:
    - type: space
      key: space-1
      title: Hana Wiki — ไทย
      path: hana
      default: true
      content:
        directory: ./docs/th
        language: th
    - type: space
      key: space-2
      title: Hana Wiki — English
      path: hana-wiki-english
      content:
        directory: ./docs/en
        language: en
    - type: space
      key: space-3
      title: Hana Wiki — 日本語
      path: hana-wiki-ri-ben-yu
      draft: true
      content:
        directory: ./docs/ja
